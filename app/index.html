<meta charset="utf-8">
<title>Reactor Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bangers&family=Luckiest+Guy&family=Montserrat:wght@500;700;800;900&family=Poppins:wght@500;700;800&family=Bebas+Neue&family=Creepster&family=Nosifer&family=Oswald:wght@500;700&family=Permanent+Marker&family=Press+Start+2P&family=Roboto:wght@400;700;900&family=Rubik+Glitch&family=Special+Elite&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* Layout: Vegas Pro 14 light-grey theme, colours sampled from the reference screenshot. Menu + toolbar; dock row = explorer (tabs at bottom) · tool strip · preview · master bus; timeline; transport + status. Single look by design. */
:root{
  --base:#848484; --list:#959595; --tabbar:#7c7c7c; --tabon:#b6b6b6; --line:#6f6f6f; --line2:#5e5e5e; --hi:#959595;
  --menu:#d6dcef; --title:#35494b; --text:#000000; --dim:#1e1e1e; --faint:#3a3a3a;
  --sel:#ffffff; --loop:#8997ac; --evsel:#c2cc5c; --wave:#6d2634; --abody:#d8d8da; --scroll:#505050;
  --ui:"Segoe UI",Tahoma,"Noto Sans",Arial,sans-serif;
  --mono:Consolas,"Lucida Console","DejaVu Sans Mono",monospace;
  --topH:46%;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--base);color:var(--text);font:12px/1.3 var(--ui);overflow:hidden;-webkit-text-size-adjust:100%}
body.scaled{overflow-x:hidden;overflow-y:auto}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:default}
:focus-visible{outline:1px dotted #000;outline-offset:1px}
::-webkit-scrollbar{width:14px;height:14px;background:var(--scroll)}
::-webkit-scrollbar-thumb{background:#8a8a8a;border:3px solid var(--scroll)}
::-webkit-scrollbar-corner{background:var(--scroll)}
#root{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;background:var(--base);overflow:hidden}
#spacer{width:1px}
svg.i{width:16px;height:16px;display:block;flex:none}

/* menubar + toolbar */
#menubar{height:21px;flex:none;background:var(--menu);display:flex;align-items:stretch;border-bottom:1px solid #b9c1d6;padding-left:2px}
.mb{position:relative}
.mb>button{height:100%;border:1px solid transparent;background:none;padding:0 7px;font-size:12px}
.mb>button:hover,.mb.open>button{background:#e5effc;border-color:#9bbbe3}
.pop{position:absolute;top:100%;left:0;min-width:240px;background:#f0f0f0;border:1px solid #979797;box-shadow:2px 3px 5px rgba(0,0,0,.35);padding:2px;z-index:60;display:none}
.mb.open .pop{display:block}
.mi{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:4px;width:100%;background:none;border:1px solid transparent;padding:3px 10px 3px 2px;text-align:left;font-size:12px;white-space:nowrap}
.mi:hover:not(:disabled){background:#d8e6f7;border-color:#a8c8ee}
.mi:disabled{color:#8d8d8d}
.mi .ck{text-align:center}
.mi kbd{font:12px var(--ui);color:#333;padding-left:20px}
.msep{height:1px;background:#d0d0d0;margin:3px 2px 3px 28px}
#toolbar{height:28px;flex:none;background:var(--base);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:1px;padding:0 3px}
.tbtn{width:24px;height:22px;border:1px solid transparent;background:none;display:grid;place-items:center;padding:0}
.tbtn:hover:not(:disabled){background:var(--hi);border-color:var(--line2)}
.tbtn.on{background:#9fa9b8;border-color:#4e5a6b}
.tbtn:disabled{opacity:.4}
.tsep{width:1px;height:18px;background:var(--line2);box-shadow:1px 0 0 var(--hi);margin:0 4px}

/* dock row */
#upper{height:var(--topH);flex:none;display:grid;grid-template-columns:var(--expW,40%) 5px minmax(0,1fr) 112px;gap:0 3px;padding:3px 3px 0;background:var(--base)}
#vsplit{cursor:col-resize;background:transparent;margin:0 -2px;position:relative;z-index:2}
#vsplit:hover,#vsplit.on{background:var(--line2)}
.dwin{background:var(--base);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.dcontent{flex:1;min-height:0;display:flex;flex-direction:column}
.dtabs{height:20px;flex:none;display:flex;align-items:stretch;background:var(--tabbar);border-top:1px solid var(--line2);padding:0;gap:0;overflow:hidden}
.dtab{border:0;border-right:1px solid var(--line2);background:var(--tabbar);padding:0 10px;font-size:11.5px;white-space:nowrap;color:#f2f2f2}
.dtab:hover{background:#8a8a8a}
.dtab.on{background:var(--tabon);color:#000}
.ptool{height:25px;flex:none;display:flex;align-items:center;gap:1px;padding:0 3px;background:var(--base);border-bottom:1px solid var(--line)}
.ptool .lbl{font-size:11.5px;color:var(--dim);margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.explorer{flex:1;min-height:0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:3px;padding:3px;background:var(--base)}
.tree{background:var(--list);border:1px solid var(--line);overflow:auto;padding:2px 0}
.tree button{display:flex;align-items:center;gap:5px;width:100%;border:1px solid transparent;background:none;padding:1px 6px;text-align:left;font-size:11.5px;white-space:nowrap}
.tree button .fold{width:14px;height:11px;flex:none;background:#e3c766;border:1px solid #a68b2c;position:relative}
.tree button:hover{background:#a3a3a3}
.tree button.on{background:var(--sel);border:1px dotted #333}
.tree .sub{padding-left:18px}
.gridw{overflow:auto;background:var(--list);border:1px solid var(--line);min-height:0}
.grid{display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;padding:5px}
.it{width:84px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 3px;border:1px solid transparent;cursor:default;user-select:none}
.it:hover{background:#a3a3a3}
.it.on{background:var(--sel);border-color:#6f6f6f}
.it canvas{width:72px;height:41px;display:block;background:#000}
.it span{font-size:10.5px;text-align:center;line-height:1.2;max-width:80px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.desc{height:28px;flex:none;background:var(--base);font-size:11px;color:var(--dim);padding:2px 6px;overflow:hidden;line-height:1.3}
.desc b{color:#000;font-weight:600}
.empty{padding:16px;color:#000;font-size:12px;line-height:1.5;max-width:340px}
.empty .wbtn{margin-top:8px}
.vstrip{grid-row:1/4;grid-column:2;background:var(--base);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
.vstrip .tbtn{width:26px;height:26px}
.vstrip .grow{flex:1}
.vstrip .tsep{width:18px;height:1px;margin:3px 0}

/* preview */
#pv{background:var(--base);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.pvbar{height:25px;flex:none;background:var(--base);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 4px}
.arg{display:flex;gap:2px;margin-right:4px}
.arbtn{height:22px;border:1px solid transparent;background:none;display:flex;align-items:center;gap:4px;padding:0 6px;font-size:11px;color:var(--text)}
.arbtn:hover{background:var(--hi);border-color:var(--line2)}
.arbtn.on{background:#9fa9b8;border-color:#4e5a6b}
.arbtn i{display:block;border:1.5px solid currentColor;border-radius:1px}
.wsel{height:19px;font-size:11.5px;border:1px solid var(--line2);background:#9a9a9a;padding:0 2px;color:#000}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:var(--base)}
#cbox{position:relative;background:#000}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
.pvtrans{height:26px;flex:none;background:var(--base);display:flex;align-items:center;justify-content:center;gap:1px;position:relative}
.pvtrans .r{position:absolute;right:4px;top:2px}
.pvinfo{height:30px;flex:none;background:var(--base);display:grid;grid-template-columns:1fr 1fr;font-size:11px;color:#000;padding:1px 8px;column-gap:16px;font-variant-numeric:tabular-nums}
.pvinfo b{font-weight:400}

/* master bus */
#master{background:var(--base);border:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.mhd{height:20px;flex:none;display:flex;align-items:center;padding:0 6px;font-size:11.5px;border-bottom:1px solid var(--line)}
.mbody{flex:1;min-height:0;display:flex;padding:6px 4px;gap:4px}
#mcv{flex:1;min-width:0;height:100%}
.fader{width:26px;display:flex;flex-direction:column;align-items:center}
.fader input{writing-mode:vertical-lr;direction:rtl;width:22px;flex:1;min-height:40px;margin:0;accent-color:#5d5d5d}
.mfoot{height:20px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:11px var(--ui);gap:10px}

#splitter{height:5px;flex:none;cursor:row-resize;background:var(--base)}
#splitter:hover{background:var(--line)}

/* timeline */
#lower{flex:1;min-height:0;display:grid;grid-template-columns:286px 32px minmax(0,1fr) 14px;grid-template-rows:42px minmax(0,1fr) 15px;margin:0 3px;border:1px solid var(--line);background:#808080}
#vscroll{grid-row:2;grid-column:4;overflow-y:scroll;overflow-x:hidden;background:var(--scroll)}
#vspace{width:1px}
.vfill{grid-column:4;background:var(--base)}
.addtr{width:26px;height:26px;border:1px solid var(--line2);background:var(--hi);font:600 18px/1 var(--ui);color:var(--text);padding:0;display:grid;place-items:center;flex:none}
.addtr:hover{background:#a3a3a3}
#tcode{flex:1;text-align:right}
.tdisp{background:var(--base);border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px 0 6px;font:400 24px var(--ui);letter-spacing:.5px;font-variant-numeric:tabular-nums;color:#000}
.heads{grid-row:2;background:#808080;border-right:1px solid var(--line);overflow:hidden;position:relative}
#hin{position:absolute;left:0;right:0;top:0}
.hcorner{grid-row:3;background:var(--base);border-right:1px solid var(--line);border-top:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 4px;font-size:11px;color:#000}
.tlarea{grid-row:1/3;grid-column:3;position:relative;min-width:0;min-height:0}
#tl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hsw{grid-row:3;grid-column:3;display:flex;background:var(--scroll);border-top:1px solid var(--line)}
#hbar{flex:1;position:relative;height:14px;background:linear-gradient(#6c6c6c,#7a7a7a);box-shadow:inset 0 1px 2px rgba(0,0,0,.35);cursor:default;touch-action:none}
#hthumb{position:absolute;top:1px;bottom:1px;min-width:26px;background:linear-gradient(#e9eaec,#bfc2c6);border:1px solid #4f5256;border-radius:2px;box-sizing:border-box}
#hthumb:hover{background:linear-gradient(#f4f5f6,#cdd0d4)}
#hthumb .hg{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
#hthumb .hg.l{left:-1px;border-right:1px solid #8a8d91}#hthumb .hg.r{right:-1px;border-left:1px solid #8a8d91}
#hthumb .hg::after{content:'';position:absolute;top:3px;bottom:3px;left:2px;width:3px;border-left:1px solid #6d7075;border-right:1px solid #6d7075}
#hthumb .hg:hover{background:rgba(61,139,221,.35)}
body.modern #hbar{background:#141414;box-shadow:none}
body.modern #hthumb{background:#3c3c3c;border-color:#141414}
body.modern #hthumb:hover{background:#4a4a4a}
body.modern #hthumb .hg::after{border-color:#8a8a8a}
:root{--undoC:#1d4b8f}
body.modern{--undoC:#3d8bdd}
.th.tdrag{opacity:.55}
#trkline{position:absolute;left:0;right:0;height:3px;background:#3d8bdd;box-shadow:0 0 0 1px rgba(255,255,255,.6);z-index:5;pointer-events:none}
.th .thl{cursor:grab}
.zbtn{width:16px;height:14px;border:0;border-left:1px solid var(--line2);background:var(--base);font:600 12px var(--ui);line-height:12px;padding:0}
.zbtn:hover{background:var(--hi)}

.th{position:absolute;left:0;right:0;display:flex;background:var(--base);border-bottom:1px solid var(--line2);border-top:1px solid var(--hi)}
.th.on{background:var(--hi)}
.thl{width:24px;flex:none;display:flex;flex-direction:column;align-items:center;padding-top:4px;gap:3px;border-right:1px solid var(--line)}
.tnum{width:17px;height:15px;color:#fff;font:11px var(--ui);display:grid;place-items:center}
.thm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding:3px 4px 2px 5px}
.thr{display:flex;align-items:center;gap:3px;min-width:0;height:18px}
.tname{flex:1;min-width:0;border:1px solid transparent;background:transparent;font-size:11.5px;padding:0 2px;height:17px}
.tname:hover{border-color:var(--line2)}
.tname:focus{outline:none;border-color:#000;background:#fff}
.tsb{width:17px;height:16px;border:1px solid transparent;background:transparent;font:700 11px var(--ui);padding:0;display:grid;place-items:center;flex:none;color:#000}
.tsb:hover{border-color:var(--line2);background:var(--hi)}
.tsb.on{background:#9fa9b8;border-color:#4e5a6b}
.tsb.mute.on{background:#b85d5d;border-color:#5e2a2a;color:#fff}
.tsb.voice.on{background:#7ca686;border-color:#2f5a3a}
.tlab{font-size:11px;color:#000;white-space:nowrap;width:30px}
.tval{font:11px var(--ui);color:#000;white-space:nowrap;width:50px;text-align:right}
.tsl{flex:1;min-width:30px;height:20px;-webkit-appearance:none;appearance:none;background:transparent;margin:0;cursor:ew-resize}
.tsl::-webkit-slider-runnable-track{height:6px;background:#2f2f2f;border:1px solid #1e1e1e;border-radius:3px;box-shadow:0 1px 0 var(--hi)}
.tsl::-moz-range-track{height:6px;background:#2f2f2f;border-radius:3px}
.tsl::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:18px;margin-top:-7px;background:linear-gradient(#f4f4f4,#bdbdbd);border:1px solid #2a2a2a;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.tsl::-moz-range-thumb{width:10px;height:17px;background:#e4e4e4;border:1px solid #2a2a2a;border-radius:2px}
.thr.big{height:22px}
.tmeter{width:6px;flex:none;margin:4px 3px 4px 0;background:#3a3d3c}


/* Vegas 14 track headers + sliders (classic theme) */
body:not(.modern) .th{background:#89888a;border-top-color:#9b9a9c;border-bottom-color:#68676a}
body:not(.modern) .th.on{background:#8599bc;border-top-color:#9db0d2}
body:not(.modern) .th.v .tnum{background:#4e6286}
body:not(.modern) .th.a .tnum{background:#6a2a3b}
body:not(.modern) .tsl::-webkit-slider-runnable-track{height:4px;background:#50565c;border:1px solid #3b4045;border-radius:1px;box-shadow:0 1px 0 rgba(255,255,255,.28)}
body:not(.modern) .tsl::-moz-range-track{height:4px;background:#50565c;border:1px solid #3b4045}
body:not(.modern) .tsl::-webkit-slider-thumb{width:24px;height:13px;margin-top:-5.5px;border:1px solid #47505a;border-radius:2px;box-shadow:0 1px 1px rgba(0,0,0,.35);background:linear-gradient(90deg,transparent 7px,#7b858f 7px,#7b858f 8px,transparent 8px,transparent 11px,#7b858f 11px,#7b858f 12px,transparent 12px,transparent 15px,#7b858f 15px,#7b858f 16px,transparent 16px),linear-gradient(#f5f7f9,#c6cdd4)}
body:not(.modern) .tsl::-moz-range-thumb{width:22px;height:11px;border:1px solid #47505a;border-radius:2px;background:linear-gradient(#f5f7f9,#c6cdd4)}
.tsb.fxb{width:20px;font-size:9.5px}
.tsb.fxb.on{background:#7ca686;border-color:#2f5a3a;color:#000}
body.modern .tsb.fxb.on{background:#28653c;border-color:#51c878;color:#fff}
/* Podcaster Pro (always dark, like a plugin) */
.fwin:has(.ppw) .fwb{padding:0;background:#1c1f24}
.ppw{background:#1c1f24;color:#d6dae0;font:12px var(--ui);user-select:none}
.ppw.byp .pp-main{opacity:.45}
.pp-top{display:flex;align-items:center;gap:10px;padding:7px 10px;background:#121418;border-bottom:1px solid #2b2f36;flex-wrap:wrap}
.pp-logo{font:800 15px/1 Montserrat,var(--ui);letter-spacing:.14em;color:#f5a623}
.pp-trk{color:#9aa1ab;font-size:11.5px;padding:2px 8px;border:1px solid #2f343c;border-radius:10px}
.pp-pre{margin-left:auto;color:#9aa1ab}
.pp-pre select{background:#23272e;color:#e6e9ee;border:1px solid #3a3f47;height:22px}
.pp-pre .wbtn,.ppbtn{height:22px;background:#2a2f37;color:#e6e9ee;border:1px solid #3a3f47;border-radius:3px;padding:0 9px;font-size:11.5px}
.ppbtn:hover,.pp-pre .wbtn:hover{background:#343a43}
.ppbtn.acc{background:#3a2e1a;border-color:#f5a623;color:#ffd38a}
.ppbtn.warn{background:#5a2626;border-color:#c0453a}
.pp-mods{display:flex;gap:5px;padding:7px 9px;background:#17191d;border-bottom:1px solid #2b2f36}
.pp-mod{flex:1;min-width:0;background:#22262c;border:1px solid #30353d;border-radius:4px;padding:5px 6px 4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;color:#8b929c}
.pp-mod:hover{background:#272b32}
.pp-mod.on{color:#dfe3e8}
.pp-mod.sel{border-color:#f5a623;box-shadow:inset 0 0 0 1px #f5a623}
.pmh{display:flex;align-items:center;gap:6px;font-size:11px;white-space:nowrap;overflow:hidden}
.pmh .pw{width:13px;height:13px;flex:none;border-radius:50%;border:2px solid #5d636b;background:transparent;padding:0}
.pp-mod.on .pw{border-color:#f5a623;background:radial-gradient(#f5a623 40%,transparent 45%)}
.pmi{width:100%;height:28px}
.pms{font-size:10px;color:#7d848e;font-variant-numeric:tabular-nums}
.pp-main{display:flex}
.pp-panel{flex:1;min-width:0;padding:8px 10px 10px}
.pp-ttl{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.pp-ttl b{font:700 12px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:#f5a623}
.pp-offn{font-size:11px;color:#c0453a}
.ppdisp{width:100%;height:190px;display:block;border:1px solid #2b2f36;border-radius:3px;background:#16191d}
.ppdisp.sq{width:180px;height:180px;flex:none}
.pp-split{display:flex;gap:14px;align-items:flex-start}
.pp-row{display:flex;align-items:center;gap:10px;margin-top:7px;flex-wrap:wrap}
.pp-bands{display:flex;gap:3px}
.pbn{width:22px;height:22px;border-radius:50%;border:2px solid #f5a623;background:#1c1f24;color:#f5a623;font:700 11px var(--ui);padding:0}
.pbn.sel{background:#f5a623;color:#1c1f24}.pbn.off{border-color:#5d636b;color:#5d636b}.pbn.add{border-color:#5d636b;color:#c9ced6}
.ppl{display:flex;align-items:center;gap:5px;color:#9aa1ab;font-size:11px}
.ppsel{background:#23272e;color:#e6e9ee;border:1px solid #3a3f47;height:22px}
.pp-knobs{display:flex;gap:6px;flex-wrap:wrap}
.pp-knobs.big{gap:18px;padding:16px 4px 8px}
.knob{display:flex;flex-direction:column;align-items:center;gap:1px;width:62px}
.knob canvas{cursor:ns-resize;touch-action:none}
.knob .kv{font:10.5px var(--ui);color:#e6e9ee;font-variant-numeric:tabular-nums;white-space:nowrap}
.knob .kl{font:700 9.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:#9aa1ab;white-space:nowrap}
.pp-side{width:96px;flex:none;background:#14161a;border-left:1px solid #2b2f36;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pp-side canvas#ppmet{width:70px;height:150px}
.pp-tip{color:#8b929c;font-size:11px;margin:7px 0 0;line-height:1.4}
.pp-foot{color:#6b727c;font-size:10.5px;margin:0;padding:3px 10px 6px}
.grbar{display:flex;align-items:center;gap:8px;margin-top:8px;color:#9aa1ab;font-size:11px}.grbar canvas{width:300px;height:12px;border-radius:2px}
.fl-wrap{background:#3a4148;border-radius:4px;padding:6px;box-shadow:inset 0 0 0 1px #262b30}
.fl-disp{width:100%;height:150px;display:block;border-radius:3px;background:#2b3237}
.fl-row{display:flex;justify-content:space-around;gap:10px;padding:8px 2px 2px}
.fl-wrap .pp-tip{color:#b7c0c7}
.pp-sect{display:flex;flex-direction:column;align-items:center;gap:4px}
.pp-sect h4{margin:0;font:700 10.5px var(--ui);letter-spacing:.16em;color:#d9dee3;border-top:1px solid #59626a;padding-top:3px;min-width:100%;text-align:center}

/* repair tools */
.rp .rpw{width:100%;height:120px;display:block;border:1px solid var(--line2);cursor:text;margin:6px 0;touch-action:none}
.rpsel{flex:1;font-size:11.5px}

/* Vegas-style render progress box */
.dlg.rendlg{width:440px}
.rdlg{font:12px var(--ui);color:#000}
.rbar{position:relative;height:22px;border:1px solid #9a9a9a;background:linear-gradient(#f2f2f2,#dcdcdc);margin:2px 0 10px;overflow:hidden}

.rbar b{position:absolute;inset:0;display:grid;place-items:center;font:700 12.5px var(--ui);color:#000;font-variant-numeric:tabular-nums}
.rrow{display:flex;justify-content:space-between;margin:5px 0;font-variant-numeric:tabular-nums}
.rchk{display:flex;align-items:center;gap:6px;margin:10px 0 4px}
.rstage{font-size:11px;color:#333;margin:2px 0 6px;min-height:14px}
.rbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.rbtns .wbtn{min-width:96px;height:24px}
.dlg.rendlg .dfoot:empty{display:none}
body:not(.modern) .dlg.rendlg{background:#f0f0f0}

/* bottom transport + status */
#transport{height:28px;flex:none;margin:0 3px;background:var(--base);border:1px solid var(--line);border-top:0;display:flex;align-items:center;gap:1px;padding:0 4px}
#transport .grow{flex:1}
.rate{font-size:11.5px;color:#000;margin:0 10px;white-space:nowrap}
#tc2{font:12px var(--ui);font-variant-numeric:tabular-nums;padding:0 8px;white-space:nowrap}
#status{height:20px;flex:none;background:var(--base);border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 8px;font-size:11px;color:#000;white-space:nowrap;overflow:hidden;margin-top:3px}
#status .grow{flex:1;overflow:hidden;text-overflow:ellipsis}

/* floating windows + dialogs */
.fwin{position:absolute;background:var(--base);border:1px solid var(--title);box-shadow:0 6px 22px rgba(0,0,0,.45);display:flex;flex-direction:column;min-width:300px;max-height:calc(100% - 20px);z-index:40}
.fwt{height:24px;flex:none;display:flex;align-items:center;background:var(--title);color:#fff;padding-left:8px;gap:6px;cursor:move;user-select:none}
.fwt span{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fwx{width:38px;height:24px;border:0;background:none;color:#fff;font-size:14px;line-height:1;padding:0}
.fwx:hover{background:#c42b1c}
.fwb{flex:1;min-height:0;overflow:auto;padding:6px 8px 8px}
.grp{border:1px solid var(--line);background:var(--base);box-shadow:inset 1px 1px 0 var(--hi);padding:5px 7px 7px;margin-bottom:6px}
.grph{font-weight:600;font-size:11.5px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.prow{display:grid;grid-template-columns:104px minmax(0,1fr) 64px;align-items:center;gap:6px;min-height:22px}
.prow label{font-size:11.5px;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow input[type=range]{width:100%;margin:0;accent-color:#4f4f4f}
.nbox{height:19px;border:1px solid var(--line2);background:#fff;font:11.5px var(--ui);text-align:right;padding:0 4px;width:100%;font-variant-numeric:tabular-nums}
.nbox:focus{outline:none;border-color:#000}
.prow select,.prow input[type=color]{grid-column:2/4;height:20px;border:1px solid var(--line2);background:#fff}
.prow input[type=color]{width:60px;padding:1px}
.prow textarea{grid-column:2/4;border:1px solid var(--line2);background:#fff;min-height:52px;resize:vertical;padding:3px;font-size:12px}
.wbtn{height:22px;border:1px solid var(--line2);background:#9a9a9a;padding:0 11px;font-size:11.5px;white-space:nowrap;color:#000}
.wbtn:hover:not(:disabled){background:#a8a8a8}
.wbtn:active{background:#8c8c8c}
.wbtn:disabled{color:#555}
.wbtn.def{border-color:#000}
.brow{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chain{display:flex;gap:3px;flex-wrap:wrap;padding:3px;background:#7a7a7a;border:1px solid var(--line2);margin-bottom:6px}
.chip{display:flex;align-items:center;gap:4px;height:22px;border:1px solid var(--line2);background:#9a9a9a;padding:0 8px 0 4px;font-size:11.5px}
.chip.on{background:#d9d9d9;border-color:#000}
.chip input{margin:0;accent-color:#3a3a3a}
.kfbar{display:flex;align-items:center;gap:2px;margin-bottom:4px}
.kfcv{width:100%;height:46px;display:block;border:1px solid var(--line2);background:var(--list);touch-action:none}
.psec{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:8px 0 2px;padding-top:6px;border-top:1px solid var(--line2)}
.psec:first-child{border-top:0;margin-top:0;padding-top:0}
.note{font-size:11px;color:#111;line-height:1.45;margin:5px 0 0}
[hidden]{display:none!important}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:70;display:flex;align-items:center;justify-content:center}
.dlg{background:var(--base);border:1px solid var(--title);box-shadow:0 10px 36px rgba(0,0,0,.45);width:560px;max-width:calc(100% - 40px);max-height:calc(100% - 40px);display:flex;flex-direction:column}

.field{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:8px;margin-bottom:7px}
.field input[type=text],.field input[type=number],.field select{height:21px;border:1px solid var(--line2);background:#fff;padding:0 4px}
.lst{border:1px solid var(--line2);background:var(--list);height:120px;overflow:auto}

.bar{height:16px;border:1px solid var(--line2);background:#9a9a9a}

.result video{width:100%;max-height:300px;background:#000;display:block}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.keys div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.keys kbd{font:12px var(--mono);color:#000}
#ctx{position:absolute;z-index:80;min-width:210px;background:#f0f0f0;border:1px solid #979797;box-shadow:2px 3px 6px rgba(0,0,0,.35);padding:2px}
#toasts{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;align-items:center;z-index:100;pointer-events:none;width:560px;max-width:90%}
.toast{background:#ffffe1;border:1px solid #646464;color:#000;padding:5px 12px;font-size:12px;box-shadow:2px 2px 5px rgba(0,0,0,.3);text-align:center}
.mkpop{position:absolute}
.droplay{position:absolute;inset:0;border:2px dashed #fff;background:rgba(255,255,255,.12);pointer-events:none;z-index:30}

.tree .sub2{padding-left:30px}
